name: Harness gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce source integrity
        run: python3 -m osenv audit
      - name: Install host tools
        run: |
          brew update
          if brew list --versions openssl@1.1 >/dev/null 2>&1; then
            brew unlink openssl@1.1
          fi
          # Some runner images retain this link after removing the old keg.
          openssl_link="$(brew --prefix)/bin/openssl"
          if [ -L "$openssl_link" ] && [ "$(readlink "$openssl_link")" = "$(brew --prefix)/opt/openssl@1.1/bin/openssl" ]; then
            rm "$openssl_link"
          fi
          brew install llvm lld nasm qemu gdb
          brew upgrade llvm lld nasm qemu gdb
      - name: Check pinned tool versions
        run: python3 -m osenv doctor
      - name: Boot and debugger gate
        run: python3 -m osenv test > gate.json
      - name: Literal placement, optimal codec, bit accounting and clock regressions
        run: python3 -m unittest osenv.raw_build_test osenv.raw_codec_test osenv.raw_size_test osenv.boot_timing_test -v
      - name: Publish verdict and small diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: |
            gate.json
            artifacts/latest-test.json
            runs/**/status.json
            runs/**/capture.json
            runs/**/gdb.mi
            runs/**/panic.json
            runs/**/serial.log
            runs/**/owner.log
            runs/**/qemu.log
