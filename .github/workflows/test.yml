name: Harness gate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host tools
        run: brew install llvm lld nasm qemu gdb
      - name: Check pinned tool versions
        run: python3 -m osenv doctor
      - name: Boot and debugger gate
        run: python3 -m osenv test > gate.json
      - name: Publish verdict and small diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-evidence
          path: |
            gate.json
            artifacts/latest-test.json
            runs/**/status.json
            runs/**/capture.json
            runs/**/gdb.mi
            runs/**/panic.json
            runs/**/serial.log
            runs/**/owner.log
            runs/**/qemu.log
