[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "osenv"
version = "0.1.0"
description = "A JSON CLI for probing and debugging bare-metal OS guests"
requires-python = ">=3.12"
license = "MIT"
dependencies = []

[project.scripts]
osenv = "osenv.__main__:main"

[tool.setuptools]
packages = ["osenv"]
